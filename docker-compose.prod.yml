# Produkční compose pro Coolify. Veřejný je jen frontend (Coolify mu přiřadí
# doménu a TLS); backend zůstává interní. Prohlížeč volá stejný origin
# (https://leky.sidd1337.dev/api/v1/*) a Next.js to proxuje na backend
# (viz rewrites v frontend/next.config.ts). Porty se nepublikují (jen expose),
# aby se nepraly s Coolify. Streamlit (laboratoř) běží pod cestou /lab na stejné
# doméně (v Coolify mu nastav doménu https://leky.sidd1337.dev/lab).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: https://leky.sidd1337.dev
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - backend

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --server.baseUrlPath=lab
    # Dockerfile healthcheck cílí na /_stcore/health; s baseUrlPath je pod /lab.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/lab/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 700m
    expose:
      - "8501"
